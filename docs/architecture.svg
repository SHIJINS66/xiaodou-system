<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- 背景 -->
  <rect width="860" height="480" fill="#ffffff"/>

  <!-- ===== 顶部：三步流水线 ===== -->
  <g font-family="'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif">
    <!-- step02 -->
    <rect x="40" y="50" width="210" height="80" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
    <text x="145" y="80" fill="#111" font-size="16" font-weight="bold" text-anchor="middle">STEP 02 · 晨间 Planner</text>
    <text x="145" y="108" fill="#555" font-size="13" text-anchor="middle">生成全天生活轨迹</text>

    <!-- 箭头 -->
    <path d="M 250 90 H 295" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

    <!-- step03 -->
    <rect x="300" y="50" width="210" height="80" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
    <text x="405" y="80" fill="#111" font-size="16" font-weight="bold" text-anchor="middle">STEP 03 · 调度 + 执行</text>
    <text x="405" y="108" fill="#555" font-size="13" text-anchor="middle">发消息 / 自拍</text>

    <!-- 箭头 -->
    <path d="M 510 90 H 555" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

    <!-- step04 -->
    <rect x="560" y="50" width="210" height="80" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
    <text x="665" y="80" fill="#111" font-size="16" font-weight="bold" text-anchor="middle">STEP 04 · 日终记忆</text>
    <text x="665" y="108" fill="#555" font-size="13" text-anchor="middle">记忆 / 会话重置</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#777"/></marker></defs>

  <!-- ===== 底座 1：角色定义 ===== -->
  <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="40" y="190" width="780" height="86" rx="6" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="430" y="216" fill="#333" font-size="13" font-weight="bold" text-anchor="middle">角色由 workspace 根目录这套文件定义（换一套 = 另一个角色）</text>
    <g font-size="12" fill="#444" text-anchor="middle">
      <rect x="80" y="232" width="96" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.8"/><text x="128" y="251">AGENTS.md</text>
      <rect x="188" y="232" width="96" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.8"/><text x="236" y="251">IDENTITY.md</text>
      <rect x="296" y="232" width="96" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.8"/><text x="344" y="251">SOUL.md</text>
      <rect x="404" y="232" width="96" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.8"/><text x="452" y="251">LIFE.md</text>
      <rect x="512" y="232" width="96" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.8"/><text x="560" y="251">USER.md</text>
      <rect x="620" y="232" width="96" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.8"/><text x="668" y="251">MEMORY.md</text>
      <rect x="728" y="232" width="70" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.8"/><text x="763" y="251">TOOLS.md</text>
    </g>
  </g>

  <!-- 连接线 -->
  <path d="M 145 130 V 190" stroke="#ccc" stroke-width="1.2" fill="none"/>
  <path d="M 665 130 V 190" stroke="#ccc" stroke-width="1.2" fill="none"/>

  <!-- ===== 底座 2：确定性工程 ===== -->
  <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="40" y="310" width="780" height="54" rx="6" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="430" y="336" fill="#333" font-size="13" font-weight="bold" text-anchor="middle">确定性工程</text>
    <g font-size="12" fill="#555" text-anchor="middle">
      <text x="180" y="352">JSON schema 校验</text>
      <text x="330" y="352">幂等门 + flock 锁</text>
      <text x="470" y="352">状态回写 + 日志</text>
      <text x="610" y="352">备份 / 镜像 / 校验</text>
    </g>
  </g>

  <!-- ===== 底部：providers ===== -->
  <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="430" y="404" fill="#333" font-size="13" font-weight="bold" text-anchor="middle">外部依赖（通过 provider 抽象接入）</text>
    <g font-size="12" fill="#555" text-anchor="middle">
      <text x="180" y="436">DeepSeek</text>
      <text x="330" y="436">Seedream 生图</text>
      <text x="470" y="436">Telegram</text>
      <text x="620" y="436">OpenClaw gateway</text>
    </g>
    <line x1="120" y1="428" x2="240" y2="428" stroke="#ddd" stroke-width="0.8"/>
    <line x1="280" y1="428" x2="380" y2="428" stroke="#ddd" stroke-width="0.8"/>
    <line x1="420" y1="428" x2="520" y2="428" stroke="#ddd" stroke-width="0.8"/>
    <line x1="560" y1="428" x2="680" y2="428" stroke="#ddd" stroke-width="0.8"/>
  </g>
</svg>
